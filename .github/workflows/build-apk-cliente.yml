name: Build Nexum Cliente APK

on:
  push:
    # También las ramas de trabajo: dos tandas se mergearon con el APK roto
    # porque el build solo corría DESPUÉS del merge a main.
    branches: [main, 'claude/**']
    paths:
      - 'AppCliente/**'
      - '.github/workflows/build-apk-cliente.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AppCliente/**'
      - '.github/workflows/build-apk-cliente.yml'
  workflow_dispatch:   # Permite ejecución manual desde GitHub UI

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Get Flutter dependencies
        working-directory: AppCliente
        run: flutter pub get

      # ── 5. Generate launcher icons & splash ──────────────────────────────────
      # AppCliente aún no tiene assets de branding (ver TODO en pubspec):
      # se genera un pin de ubicación provisional con la paleta Nexum.
      # Los íconos son ASSETS VERSIONADOS (assets/icons/), no generados en CI:
      # antes un script de Pillow los dibujaba en cada build y el resultado
      # se veía amateur. Ahora flutter_launcher_icons parte del logo real.
      - name: Generate launcher icons
        working-directory: AppCliente
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: AppCliente
        run: dart run flutter_native_splash:create

      # ── 6. Decode Firebase google-services.json (opcional) ──────────────────
      # App Android propia en Firebase: package com.nexum.nexum_client.
      # Sin el secret, el build sale sin push (la app lo tolera).
      - name: Decode google-services.json
        working-directory: AppCliente/android/app
        env:
          GOOGLE_SERVICES_CLIENTE_BASE64: ${{ secrets.GOOGLE_SERVICES_CLIENTE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_CLIENTE_BASE64" ]; then
            echo "$GOOGLE_SERVICES_CLIENTE_BASE64" | base64 --decode > google-services.json
            echo "Firebase config loaded"
          else
            echo "No Firebase secret — build will skip Firebase init"
          fi

      # ── 6b. Firma release estable (secrets ANDROID_KEYSTORE_*) ──────────────
      # Misma llave que la app del conductor: la firma no cambia entre builds y
      # las actualizaciones instalan sobre la app existente. Sin los secrets cae
      # a la llave debug (firma efímera: solo pruebas).
      - name: Configure release signing
        working-directory: AppCliente/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Sin ANDROID_KEYSTORE_BASE64 — firma debug (solo pruebas)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/nexum-release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=nexum"
            echo "storeFile=nexum-release.jks"
          } > key.properties
          echo "Firma release persistente configurada"

      # ── 7. Build APK ─────────────────────────────────────────────────────────
      # --build-number=run_number: versionCode estrictamente creciente para que
      # Android acepte actualizar sobre la instalación previa.
      - name: Build release APK
        working-directory: AppCliente
        env:
          API_BASE_URL: 'https://nexum-api-trxr.onrender.com'
          WS_BASE_URL: 'wss://nexum-api-trxr.onrender.com'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_CLIENTE }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_TAG=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=WS_BASE_URL=${WS_BASE_URL} \
            --dart-define=SENTRY_DSN=${SENTRY_DSN}

      # ── 8. Build App Bundle (para Play Store) ────────────────────────────────
      - name: Build App Bundle (AAB)
        working-directory: AppCliente
        env:
          API_BASE_URL: 'https://nexum-api-trxr.onrender.com'
          WS_BASE_URL: 'wss://nexum-api-trxr.onrender.com'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_CLIENTE }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=WS_BASE_URL=${WS_BASE_URL} \
            --dart-define=SENTRY_DSN=${SENTRY_DSN}

      # ── 8b. Verificar la firma REAL del APK ──────────────────────────────────
      # El paso de configuración solo dice que escribió key.properties; esto
      # comprueba con qué llave quedó firmado el APK que se va a publicar.
      # Huella esperada de la llave estable de ZIPA (alias 'nexum'):
      #   SHA-1 BE:43:56:0E:CB:21:B4:2D:99:A7:5A:3C:B5:6F:B0:FA:05:B5:21:76
      # Informativo: no falla el build (sin secrets la firma debug es legítima
      # para pruebas), pero deja la evidencia en el log.
      - name: Verify APK signature
        working-directory: AppCliente
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED="BE:43:56:0E:CB:21:B4:2D:99:A7:5A:3C:B5:6F:B0:FA:05:B5:21:76"
          FINGERPRINT=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
            | grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d ' \r')
          echo "Huella SHA-1 del APK: ${FINGERPRINT:-<no se pudo leer>}"
          if [ "$FINGERPRINT" = "$EXPECTED" ]; then
            echo "✅ Firmado con la llave estable de Nexum — se instala sobre la versión anterior."
          else
            # ::warning:: y no un simple echo: esto sale en el panel de
            # Annotations del run, junto al título. Con solo echo el aviso
            # quedaba sepultado en el log y el APK parecía correcto — que es
            # exactamente lo que pasó: dos versiones seguidas se descargaron
            # creyendo que actualizaban, y el teléfono se quedó con la vieja.
            echo "::warning title=APK sin la llave estable::Este APK NO se instala encima de la version anterior. Hay que desinstalar la app primero, y no sirve para Google Play. Configura los secrets ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD."
            echo "⚠️  NO coincide con la llave estable."
            echo "    Esperada: $EXPECTED"
            echo "    Obtenida: ${FINGERPRINT:-<no se pudo leer>}"
          fi

      # ── 8c. Repartir a los probadores (Firebase App Distribution) ────────────
      # Sin esto, cada versión nueva significaba escribirle el enlace a cada
      # conductor y negocio por WhatsApp. Con esto les llega una notificación y
      # actualizan con un toque.
      #
      # Requiere dos secrets; sin ellos el paso se salta y el build sigue igual:
      #   FIREBASE_SERVICE_ACCOUNT_JSON  → cuenta de servicio con el rol
      #                                    "Firebase App Distribution Admin"
      #   FIREBASE_APP_ID_CLIENTE       → App ID de la app cliente (1:123…:android:abc…)
      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_CLIENTE }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'pilotos' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Sin secrets de Firebase — no se reparte (el APK queda como artefacto)."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npm install -g firebase-tools@13
          # El mensaje de la versión es el título del commit: el probador ve
          # QUÉ cambió, no un número de build sin significado.
          NOTAS="build ${{ github.run_number }} · ${{ github.event.head_commit.message }}"
          firebase appdistribution:distribute \
            AppCliente/build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$NOTAS"
          echo "✅ Repartido al grupo $TESTER_GROUPS"
          rm -f "$RUNNER_TEMP/fb-sa.json"

      # ── 9. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nexum-cliente-apk-build${{ github.run_number }}
          path: AppCliente/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v7
        with:
          name: nexum-cliente-aab-build${{ github.run_number }}
          path: AppCliente/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 10. Build info ───────────────────────────────────────────────────────
      - name: Show build info
        run: |
          echo "✅ Build complete!"
          ls -lh AppCliente/build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -lh AppCliente/build/app/outputs/bundle/release/ 2>/dev/null || true
