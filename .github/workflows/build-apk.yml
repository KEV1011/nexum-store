name: Build Nexum Driver APK

on:
  push:
    # También las ramas de trabajo: dos tandas se mergearon con el APK roto
    # porque el build solo corría DESPUÉS del merge a main.
    branches: [main, 'claude/**']
    paths:
      - 'AppTransport/**'
  pull_request:
    branches: [main]
    paths:
      - 'AppTransport/**'
  workflow_dispatch:   # Permite ejecución manual desde GitHub UI

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Get Flutter dependencies
        working-directory: AppTransport
        run: flutter pub get

      # ── 5. Generate launcher icons & splash ──────────────────────────────────
      # Los íconos son ASSETS VERSIONADOS (assets/icons/), no generados en CI:
      # antes un script de Pillow los dibujaba en cada build y el resultado
      # se veía amateur. Ahora flutter_launcher_icons parte del logo real.
      - name: Generate launcher icons
        working-directory: AppTransport
        run: flutter pub run flutter_launcher_icons

      - name: Generate native splash
        working-directory: AppTransport
        run: flutter pub run flutter_native_splash:create

      # ── 6a. Decode Firebase google-services.json (opcional) ─────────────────
      - name: Decode google-services.json
        working-directory: AppTransport/android/app
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > google-services.json
            echo "Firebase config loaded"
          else
            echo "No Firebase secret — build will skip Firebase init"
          fi

      # ── 6. Firma release estable (secrets ANDROID_KEYSTORE_*) ───────────────
      # La MISMA llave en cada build → las actualizaciones instalan sobre la app
      # existente y Play Protect deja de ver una app con firma nueva cada vez.
      # Sin los secrets cae a la llave debug (firma efímera: solo pruebas).
      - name: Configure release signing
        working-directory: AppTransport/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Sin ANDROID_KEYSTORE_BASE64 — firma debug (solo pruebas)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/nexum-release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=nexum"
            echo "storeFile=nexum-release.jks"
          } > key.properties
          echo "Firma release persistente configurada"

      # ── 7. Build APK ─────────────────────────────────────────────────────────
      # --build-number=run_number: cada APK tiene versionCode estrictamente
      # mayor — Android acepta la actualización sobre la instalación previa.
      - name: Build release APK
        working-directory: AppTransport
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_BASE_URL: 'https://nexum-api-trxr.onrender.com'
          WS_BASE_URL: 'wss://nexum-api-trxr.onrender.com'
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_TAG=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=WS_BASE_URL=${WS_BASE_URL} \
            -PGOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}"

      # ── 8. Build App Bundle (para Play Store) ────────────────────────────────
      - name: Build App Bundle (AAB)
        working-directory: AppTransport
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_BASE_URL: 'https://nexum-api-trxr.onrender.com'
          WS_BASE_URL: 'wss://nexum-api-trxr.onrender.com'
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_TAG=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=WS_BASE_URL=${WS_BASE_URL} \
            -PGOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}"

      # ── 8b. Verificar la firma REAL del APK ──────────────────────────────────
      # El paso de configuración solo dice que escribió key.properties; esto
      # comprueba con qué llave quedó firmado el APK que se va a publicar.
      # Huella esperada de la llave estable de ZIPA (alias 'nexum'):
      #   SHA-1 BE:43:56:0E:CB:21:B4:2D:99:A7:5A:3C:B5:6F:B0:FA:05:B5:21:76
      # Informativo: no falla el build (sin secrets la firma debug es legítima
      # para pruebas), pero deja la evidencia en el log.
      - name: Verify APK signature
        working-directory: AppTransport
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED="BE:43:56:0E:CB:21:B4:2D:99:A7:5A:3C:B5:6F:B0:FA:05:B5:21:76"
          FINGERPRINT=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
            | grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d ' \r')
          echo "Huella SHA-1 del APK: ${FINGERPRINT:-<no se pudo leer>}"
          if [ "$FINGERPRINT" = "$EXPECTED" ]; then
            echo "✅ Firmado con la llave estable de ZIPA — se instala sobre la versión anterior."
          else
            echo "⚠️  NO coincide con la llave estable (esperada: $EXPECTED)."
            echo "    Probable firma debug: hay que desinstalar la app antes de instalar,"
            echo "    y este APK no sirve para Google Play."
            echo "    Revisa los secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD."
          fi

      # ── 8c. Repartir a los probadores (Firebase App Distribution) ────────────
      # Sin esto, cada versión nueva significaba escribirle el enlace a cada
      # conductor y negocio por WhatsApp. Con esto les llega una notificación y
      # actualizan con un toque.
      #
      # Requiere dos secrets; sin ellos el paso se salta y el build sigue igual:
      #   FIREBASE_SERVICE_ACCOUNT_JSON  → cuenta de servicio con el rol
      #                                    "Firebase App Distribution Admin"
      #   FIREBASE_APP_ID_DRIVER        → App ID de la app conductor (1:123…:android:abc…)
      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_DRIVER }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'pilotos' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Sin secrets de Firebase — no se reparte (el APK queda como artefacto)."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npm install -g firebase-tools@13
          # El mensaje de la versión es el título del commit: el probador ve
          # QUÉ cambió, no un número de build sin significado.
          NOTAS="build ${{ github.run_number }} · ${{ github.event.head_commit.message }}"
          firebase appdistribution:distribute \
            AppTransport/build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$NOTAS"
          echo "✅ Repartido al grupo $TESTER_GROUPS"
          rm -f "$RUNNER_TEMP/fb-sa.json"

      # ── 9. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexum-driver-apk
          path: AppTransport/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nexum-driver-aab
          path: AppTransport/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 10. Build info ───────────────────────────────────────────────────────
      - name: Show build info
        run: |
          echo "✅ Build complete!"
          ls -lh AppTransport/build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -lh AppTransport/build/app/outputs/bundle/release/ 2>/dev/null || true
